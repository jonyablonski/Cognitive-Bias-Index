{{ $opts := dict "target" "es2015" }}
{{- $scripts := resources.Get "js/app.js" | js.Build $opts | minify -}}

{{ if and (eq (getenv "HUGO_ENV") "production") (getenv "MIXPANEL_TOKEN") }}
<!-- Analytics token (injected at build time; absent outside production) -->
<meta name="mixpanel-token" content="{{ getenv "MIXPANEL_TOKEN" }}">
{{ end }}

<!-- JS Bundle -->
<script src="{{ $scripts.Permalink }}" integrity="{{ $scripts.Data.Integrity }}" media="screen"></script>

<!-- Initialize the service worker -->
{{ if eq ( getenv "HUGO_ENV" ) "production" }}
<script>
if (navigator && navigator.serviceWorker) {
  navigator.serviceWorker.register('/service-worker.js');
}
</script>
{{ end }}
